<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Hoops for Hope Countdown</title>
<style>
  :root {
    --navy: #071B33;
    --navy-2: #0B2748;
    --white: #FFFFFF;
    --muted: #B8C7D9;
    --candy-red: #E63946;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
  }

  .canvas {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }

  .bug {
    position: absolute;
    left: 72px;
    bottom: 72px;
    width: 650px;
    min-height: 230px;
    background: var(--navy);
    border-left: 12px solid var(--candy-red);
    color: var(--white);
    padding: 24px 30px 22px 30px;
    overflow: hidden;
  }

  .title-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .event {
    margin: 0;
    font-size: 32px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-align: center;
  }

  .rule {
    height: 3px;
    background: var(--candy-red);
    margin: 12px 0 22px 0;
  }

  .countdown-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .countdown {
    font-size: 66px;
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: center;
  }

  .labels {
    display: grid;
    grid-template-columns: 108px 108px 108px 108px;
    justify-content: center;
    margin-top: 12px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .complete {
    display: none;
    margin-top: 8px;
    font-size: 44px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-align: center;
    color: var(--white);
  }

  .complete span {
    color: var(--candy-red);
  }

  .promo-banner {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 68px;
    width: 12px;
    background: var(--candy-red);
    color: var(--white);
    display: flex;
    align-items: center;
    padding-left: 24px;
    white-space: nowrap;
    overflow: hidden;
    transition: width 700ms ease;
    z-index: 5;
  }

  .promo-banner.show {
    width: 590px;
  }

  .promo-text {
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 180ms ease 220ms, transform 220ms ease 220ms;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .promo-banner.show .promo-text {
    opacity: 1;
    transform: translateX(0);
  }

  .promo-line-1 {
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .promo-line-2 {
    font-size: 18px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="canvas" aria-label="Hoops for Hope countdown graphic">
  <section class="bug">
    <div class="title-wrap">
      <h1 class="event">Hoops for Hope</h1>
    </div>

    <div class="rule"></div>

    <div id="activeCountdown" class="countdown-wrap">
      <div class="countdown" id="countdown">00:00:00:00</div>
      <div class="labels" aria-hidden="true">
        <div>Days</div>
        <div>Hours</div>
        <div>Minutes</div>
        <div>Seconds</div>
      </div>
    </div>

    <div class="complete" id="completeMessage">
      Event <span>Complete</span>
    </div>

    <div class="promo-banner" id="promoBanner" aria-hidden="true">
      <div class="promo-text">
        <div class="promo-line-1">Hoops For Hope 2026</div>
        <div class="promo-line-2">Oct 9–Oct 10</div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  // Saturday, October 10, 2026 at 7:00 AM in Massachusetts (EDT, UTC-4)
  const TARGET = new Date("2026-10-10T07:00:00-04:00").getTime();

  const countdownEl = document.getElementById("countdown");
  const activeEl = document.getElementById("activeCountdown");
  const completeEl = document.getElementById("completeMessage");
  const promoBanner = document.getElementById("promoBanner");

  const pad2 = (n) => String(n).padStart(2, "0");

  function updateCountdown() {
    const now = Date.now();
    const diff = TARGET - now;

    if (diff <= 0) {
      countdownEl.textContent = "00:00:00:00";
      activeEl.style.display = "none";
      completeEl.style.display = "block";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    countdownEl.textContent =
      `${pad2(days)}:${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}`;
  }

  function showPromo() {
    promoBanner.classList.add("show");
    window.setTimeout(() => {
      promoBanner.classList.remove("show");
    }, 7000);
  }

  function scheduleNextPromo() {
    const minDelay = 10 * 60 * 1000;
    const maxDelay = 15 * 60 * 1000;
    const delay = Math.floor(Math.random() * (maxDelay - minDelay + 1)) + minDelay;
    window.setTimeout(() => {
      showPromo();
      scheduleNextPromo();
    }, delay);
  }

  updateCountdown();
  window.setInterval(updateCountdown, 250);

  // First reveal shortly after the source is shown.
  window.setTimeout(showPromo, 1200);

  // Then repeat at a randomized 10-15 minute interval.
  scheduleNextPromo();
})();
</script>
</body>
</html>
