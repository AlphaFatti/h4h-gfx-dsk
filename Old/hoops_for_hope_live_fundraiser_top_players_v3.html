<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Hoops for Hope Live Fundraiser + Top Players</title>
<style>
  :root {
    --navy: #071B33;
    --white: #FFFFFF;
    --muted: #B8C7D9;
    --track: #29425E;
    --candy-red: #E63946;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
  }

  .canvas {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  .fundraiser {
    position: absolute;
    left: 416px;
    bottom: 48px;
    width: 1456px;
    height: 150px;
    color: var(--white);
    overflow: hidden;
    background: transparent;
  }

  /* ---------- BROADCAST BUILD ---------- */

  .red-build,
  .blue-build {
    position: absolute;
    inset: 0;
    transform: translateY(101%);
    will-change: transform;
  }

  .red-build {
    z-index: 1;
    background: var(--candy-red);
  }

  .blue-build {
    z-index: 2;
    background: var(--navy);
  }

  .fundraiser.booting .red-build {
    animation: redUp 360ms cubic-bezier(.18,.76,.22,1) both;
  }

  .fundraiser.booting .blue-build {
    animation: blueUp 430ms cubic-bezier(.18,.76,.22,1) 210ms both;
  }

  .fundraiser.built .red-build,
  .fundraiser.built .blue-build {
    transform: translateY(0);
  }

  @keyframes redUp {
    from { transform: translateY(101%); }
    to   { transform: translateY(0); }
  }

  @keyframes blueUp {
    from { transform: translateY(101%); }
    to   { transform: translateY(0); }
  }

  .accent-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5px;
    z-index: 10;
    background: var(--candy-red);
    transform: scaleX(0);
    transform-origin: left center;
  }

  .fundraiser.booting .accent-edge {
    animation: edgeIn 280ms ease-out 565ms both;
  }

  .fundraiser.built .accent-edge {
    transform: scaleX(1);
  }

  @keyframes edgeIn {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  /* ---------- FUNDRAISER STATE ---------- */

  .stats-content {
    position: absolute;
    inset: 0;
    z-index: 4;
    padding: 17px 23px 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .fundraiser.booting .stats-content {
    animation: contentPop 260ms cubic-bezier(.17,.84,.32,1.18) 680ms both;
  }

  @keyframes contentPop {
    from {
      opacity: 0;
      transform: translateY(9px) scale(.992);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .stats-content.ticker-hidden {
    opacity: 0;
    transform: translateY(15px) scale(.994);
    transition:
      opacity 170ms cubic-bezier(.55,.06,.68,.19),
      transform 220ms cubic-bezier(.55,.06,.68,.19);
  }

  .stats-content.stats-return {
    animation: statsReturn 300ms cubic-bezier(.17,.84,.32,1.15) both;
  }

  @keyframes statsReturn {
    from {
      opacity: 0;
      transform: translateY(10px) scale(.995);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px;
    min-width: 0;
  }

  .block {
    min-width: 0;
    position: relative;
  }

  .goal { text-align: right; }

  /*
    Initial data reveal: a compact broadcast-style accent wipe crosses each
    data block, followed by the typography snapping into place.
  */
  .block::after {
    content: "";
    position: absolute;
    z-index: 6;
    top: -5px;
    bottom: -5px;
    width: 58%;
    background: var(--candy-red);
    opacity: 0;
    pointer-events: none;
  }

  .block:first-child::after {
    left: -4px;
    transform: scaleX(0);
    transform-origin: left center;
  }

  .goal::after {
    right: -4px;
    transform: scaleX(0);
    transform-origin: right center;
  }

  .fundraiser.booting .block:first-child::after {
    animation: statWipeLeft 390ms cubic-bezier(.18,.78,.24,1) 735ms both;
  }

  .fundraiser.booting .goal::after {
    animation: statWipeRight 390ms cubic-bezier(.18,.78,.24,1) 825ms both;
  }

  @keyframes statWipeLeft {
    0%   { opacity: 1; transform: scaleX(0); }
    48%  { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0; transform: scaleX(1); }
  }

  @keyframes statWipeRight {
    0%   { opacity: 1; transform: scaleX(0); }
    48%  { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0; transform: scaleX(1); }
  }

  .fundraiser.booting .block:first-child .label,
  .fundraiser.booting .block:first-child .raised-value {
    animation: statPunchLeft 310ms cubic-bezier(.16,.86,.29,1.22) 850ms both;
  }

  .fundraiser.booting .goal .label,
  .fundraiser.booting .goal .goal-value {
    animation: statPunchRight 310ms cubic-bezier(.16,.86,.29,1.22) 940ms both;
  }

  @keyframes statPunchLeft {
    from {
      opacity: 0;
      transform: translateX(-15px) translateY(3px) scale(1.045);
    }
    to {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1);
    }
  }

  @keyframes statPunchRight {
    from {
      opacity: 0;
      transform: translateX(15px) translateY(3px) scale(1.045);
    }
    to {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1);
    }
  }

  .label {
    margin-bottom: 4px;
    font-size: 12px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .raised-value {
    font-size: 45px;
    line-height: .94;
    font-weight: 900;
    letter-spacing: -.025em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .goal-value {
    font-size: 30px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.015em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 18px;
    margin-top: 16px;
    background: var(--track);
    overflow: hidden;
    transform-origin: left center;
  }

  .fundraiser.booting .progress-track {
    animation: trackDraw 340ms cubic-bezier(.18,.78,.24,1) 1020ms both;
  }

  @keyframes trackDraw {
    from {
      opacity: 0;
      transform: scaleX(0);
    }
    to {
      opacity: 1;
      transform: scaleX(1);
    }
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background: var(--candy-red);
    transform-origin: left center;
    transition: width 700ms cubic-bezier(.22,.8,.28,1);
  }

  /*
    The actual width remains data-driven. During the first entrance only,
    scale the already-correct fill from zero to its live position so it
    appears to chase the track onto the screen.
  */
  .fundraiser.booting .progress-fill {
    animation: fillChase 620ms cubic-bezier(.20,.82,.24,1) 1240ms both;
  }

  @keyframes fillChase {
    from { transform: scaleX(0); }
    78%  { transform: scaleX(1.035); }
    to   { transform: scaleX(1); }
  }

  .progress-track::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 5px;
    left: -8px;
    background: var(--white);
    opacity: 0;
    pointer-events: none;
  }

  .fundraiser.booting .progress-track::after {
    animation: progressTick 520ms cubic-bezier(.18,.78,.24,1) 1110ms both;
  }

  @keyframes progressTick {
    0% {
      opacity: 0;
      left: -8px;
    }
    18% {
      opacity: 1;
    }
    82% {
      opacity: 1;
      left: calc(100% - 5px);
    }
    100% {
      opacity: 0;
      left: calc(100% + 8px);
    }
  }

  /* ---------- TOP PLAYERS TICKER ---------- */

  /*
    Ticker transition "stinger":
      1) a full candy-red slab punches upward,
      2) navy wipes across the player lane,
      3) TOP PLAYERS punches in,
      4) the live ticker starts moving.
    No gradients, glows, or glass effects.
  */
  .ticker-stinger {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    visibility: hidden;
    overflow: hidden;
  }

  .ticker-stinger.intro {
    visibility: visible;
  }

  .stinger-red {
    position: absolute;
    inset: 0;
    background: var(--candy-red);
    transform: translateY(102%);
  }

  .ticker-stinger.intro .stinger-red {
    animation: tickerRedPunch 280ms cubic-bezier(.16,.84,.27,1) both;
  }

  @keyframes tickerRedPunch {
    0%   { transform: translateY(102%); }
    72%  { transform: translateY(-5%); }
    100% { transform: translateY(0); }
  }

  .stinger-blue {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 240px;
    background: var(--navy);
    transform: scaleX(0);
    transform-origin: right center;
  }

  .ticker-stinger.intro .stinger-blue {
    animation: tickerBlueSweep 310ms cubic-bezier(.18,.76,.22,1) 265ms both;
  }

  @keyframes tickerBlueSweep {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  .stinger-white-tick {
    position: absolute;
    z-index: 2;
    left: 240px;
    top: 0;
    width: 5px;
    height: 100%;
    background: var(--white);
    transform: scaleY(0);
    transform-origin: bottom center;
  }

  .ticker-stinger.intro .stinger-white-tick {
    animation:
      tickUp 170ms ease-out 480ms both,
      tickAway 150ms ease-in 720ms forwards;
  }

  @keyframes tickUp {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }

  @keyframes tickAway {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  .ticker-layer {
    position: absolute;
    inset: 0;
    z-index: 7;
    display: flex;
    opacity: 0;
    pointer-events: none;
  }

  .ticker-layer.active {
    opacity: 1;
  }

  .ticker-layer.ticker-exit {
    animation: tickerLayerOut 180ms cubic-bezier(.55,.06,.68,.19) both;
  }

  @keyframes tickerLayerOut {
    from {
      opacity: 1;
      transform: translateY(0);
    }
    to {
      opacity: 0;
      transform: translateY(-8px);
    }
  }

  .ticker-label {
    position: relative;
    z-index: 2;
    flex: 0 0 240px;
    height: 100%;
    background: var(--candy-red);
    display: flex;
    align-items: center;
    padding: 0 26px;
    font-size: 26px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: .035em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .ticker-label-text {
    display: block;
  }

  .ticker-layer.intro .ticker-label-text {
    animation: tickerLabelPunch 250ms cubic-bezier(.14,.86,.30,1.28) both;
  }

  @keyframes tickerLabelPunch {
    from {
      opacity: 0;
      transform: translateX(-18px) scale(1.08);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  .ticker-viewport {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: var(--navy);
  }

  .ticker-track {
    position: absolute;
    left: 0;
    display: flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
    will-change: transform;
  }

  .ticker-item {
    display: inline-flex;
    align-items: baseline;
    flex: 0 0 auto;
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.01em;
  }

  .ticker-amount {
    margin-left: 11px;
    color: var(--muted);
    font-size: 23px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .ticker-separator {
    display: inline-block;
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    margin: 0 28px;
    background: var(--candy-red);
  }

  @media (prefers-reduced-motion: reduce) {
    .red-build,
    .blue-build,
    .stats-content,
    .ticker-layer,
    .ticker-stinger,
    .stinger-red,
    .stinger-blue,
    .stinger-white-tick,
    .accent-edge {
      animation: none !important;
      transition: none !important;
    }

    .blue-build,
    .stats-content,
    .accent-edge,
    .progress-track,
    .progress-fill,
    .label,
    .raised-value,
    .goal-value {
      opacity: 1 !important;
      transform: none !important;
    }

    .ticker-layer {
      display: none !important;
    }
  }
</style>
</head>
<body>
<main class="canvas">
  <section class="fundraiser booting" id="fundraiser" aria-label="Hoops for Hope fundraising progress">

    <div class="red-build" aria-hidden="true"></div>
    <div class="blue-build" aria-hidden="true"></div>

    <div class="stats-content" id="statsContent">
      <div class="top">
        <div class="block">
          <div class="label">Raised</div>
          <div class="raised-value" id="raised">$26,939.98</div>
        </div>

        <div class="block goal">
          <div class="label">2026 Goal</div>
          <div class="goal-value" id="goal">$70,000</div>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="fill"></div>
      </div>
    </div>

    <div class="ticker-stinger" id="tickerStinger" aria-hidden="true">
      <div class="stinger-red"></div>
      <div class="stinger-blue"></div>
      <div class="stinger-white-tick"></div>
    </div>

    <div class="ticker-layer" id="tickerLayer" aria-label="Top Players">
      <div class="ticker-label"><span class="ticker-label-text">Top Players:</span></div>
      <div class="ticker-viewport" id="tickerViewport">
        <div class="ticker-track" id="tickerTrack"></div>
      </div>
    </div>

    <div class="accent-edge" aria-hidden="true"></div>
  </section>
</main>

<script>
(() => {
  const SEED = {
    raised: 26939.98,
    goal: 70000.00,
    players: [
      { name: "Phil Arsenault", amount: 8650.00 },
      { name: "Paul Watters", amount: 2115.31 },
      { name: "Adam and Valerie Radl", amount: 1590.00 },
      { name: "Elsie Concepción", amount: 1520.00 },
      { name: "Joshua Dunlavey", amount: 1505.00 },
      { name: "David Martin", amount: 1150.00 },
      { name: "Brandon Moye", amount: 1100.00 },
      { name: "Jason Reinhardt", amount: 1000.00 },
      { name: "Jay Grasso", amount: 1000.00 },
      { name: "Ben Elfner", amount: 775.00 },
      { name: "Logan and Chris Hall", amount: 730.00 },
      { name: "Kevin Shen", amount: 500.00 }
    ]
  };

  const STORAGE_KEY = "hoops-for-hope-overlay-last-good-v2";
  const UPDATE_INTERVAL_MS = 60 * 1000;
  const REQUEST_TIMEOUT_MS = 9000;

  const FIRST_TICKER_DELAY_MS = 15 * 1000;
  const TICKER_INTERVAL_MS = 15 * 60 * 1000;
  const TICKER_SPEED_PX_PER_SEC = 125;

  const fundraiserEl = document.getElementById("fundraiser");
  const statsContent = document.getElementById("statsContent");
  const raisedEl = document.getElementById("raised");
  const goalEl = document.getElementById("goal");
  const fillEl = document.getElementById("fill");
  const tickerLayer = document.getElementById("tickerLayer");
  const tickerStinger = document.getElementById("tickerStinger");
  const tickerViewport = document.getElementById("tickerViewport");
  const tickerTrack = document.getElementById("tickerTrack");

  let inFlight = false;
  let tickerRunning = false;
  let tickerTimer = null;
  let lastGood = loadSaved() || SEED;

  const money = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  const wholeMoney = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  });

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;

      const value = JSON.parse(raw);

      if (
        Number.isFinite(value.raised) &&
        Number.isFinite(value.goal) &&
        value.raised >= 0 &&
        value.goal >= 50000 &&
        Array.isArray(value.players) &&
        value.players.length > 0
      ) {
        return value;
      }
    } catch (_) {}

    return null;
  }

  function saveGood(value) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    } catch (_) {}
  }

  function renderStats(value) {
    const pct = Math.max(0, Math.min(100, (value.raised / value.goal) * 100));

    raisedEl.textContent = money.format(value.raised);
    goalEl.textContent = wholeMoney.format(value.goal);

    requestAnimationFrame(() => {
      fillEl.style.width = pct.toFixed(4) + "%";
    });
  }

  function renderTickerItems(players) {
    tickerTrack.replaceChildren();

    players.forEach((player, index) => {
      const item = document.createElement("span");
      item.className = "ticker-item";

      const name = document.createElement("span");
      name.textContent = player.name;

      const amount = document.createElement("span");
      amount.className = "ticker-amount";
      amount.textContent = money.format(player.amount);

      item.append(name, amount);
      tickerTrack.appendChild(item);

      if (index !== players.length - 1) {
        const separator = document.createElement("span");
        separator.className = "ticker-separator";
        separator.setAttribute("aria-hidden", "true");
        tickerTrack.appendChild(separator);
      }
    });
  }

  function settleInitialBuild() {
    /*
      Keep the booting class alive long enough for the staggered data reveal,
      then freeze everything into the clean static "built" state.
    */
    window.setTimeout(() => {
      fundraiserEl.classList.remove("booting");
      fundraiserEl.classList.add("built");
    }, 1950);
  }

  function rawToText(raw) {
    if (/<(?:html|body|div|section|h[1-6]|p|span)\b/i.test(raw)) {
      try {
        const doc = new DOMParser().parseFromString(raw, "text/html");
        return doc.body ? doc.body.innerText : raw;
      } catch (_) {}
    }
    return raw;
  }

  function parseOverall(text) {
    const match = text.match(
      /\$([\d,]+(?:\.\d{2})?)\s+of\s+\$([\d,]+(?:\.\d{2})?)\s+goal/i
    );

    if (!match) {
      throw new Error("Overall fundraiser total was not found.");
    }

    const raised = Number(match[1].replace(/,/g, ""));
    const goal = Number(match[2].replace(/,/g, ""));

    if (
      !Number.isFinite(raised) ||
      !Number.isFinite(goal) ||
      raised < 0 ||
      goal < 50000
    ) {
      throw new Error("Overall fundraiser values were invalid.");
    }

    return { raised, goal };
  }

  function parseTopPlayers(raw) {
    /*
      Jina's fallback preserves player headings as "### Name".
      This is the cleanest path when the site's direct request is CORS-blocked.
    */
    const markdownSectionMatch = raw.match(
      /(?:^|\n)##\s*Top Players\s*([\s\S]*?)(?=(?:^|\n)##\s*Select a Player)/im
    );

    if (markdownSectionMatch) {
      const section = markdownSectionMatch[1];
      const players = [];
      const re =
        /(?:^|\n)###\s*([^\n]+)[\s\S]*?Raised\s+\$([\d,]+(?:\.\d{2})?)/gim;

      let match;
      while ((match = re.exec(section)) !== null) {
        const name = match[1].trim();
        const amount = Number(match[2].replace(/,/g, ""));
        if (name && Number.isFinite(amount) && amount >= 0) {
          players.push({ name, amount });
        }
      }

      if (players.length > 0) return players;
    }

    /*
      Direct HTML path: locate the Top Players H2 and read H3 player cards
      until the next H2 ("Select a Player").
    */
    try {
      const doc = new DOMParser().parseFromString(raw, "text/html");
      const headings = [...doc.querySelectorAll("h2")];
      const topHeading = headings.find(
        h => h.textContent.trim().toLowerCase() === "top players"
      );

      if (topHeading) {
        const allElements = [...doc.body.querySelectorAll("*")];
        const startIndex = allElements.indexOf(topHeading);
        let endIndex = allElements.length;

        for (let i = startIndex + 1; i < allElements.length; i++) {
          if (
            allElements[i].tagName === "H2" &&
            allElements[i].textContent.trim().toLowerCase() === "select a player"
          ) {
            endIndex = i;
            break;
          }
        }

        const playerHeadings = allElements
          .slice(startIndex + 1, endIndex)
          .filter(el => el.tagName === "H3");

        const players = [];

        for (const h3 of playerHeadings) {
          const name = h3.textContent.trim();
          let node = h3;
          let amount = null;

          for (let depth = 0; depth < 6 && node; depth++, node = node.parentElement) {
            const cardText = node.textContent || "";
            const amountMatch = cardText.match(
              /Raised\s+\$([\d,]+(?:\.\d{2})?)/i
            );
            if (amountMatch) {
              amount = Number(amountMatch[1].replace(/,/g, ""));
              break;
            }
          }

          if (name && Number.isFinite(amount) && amount >= 0) {
            players.push({ name, amount });
          }
        }

        if (players.length > 0) return players;
      }
    } catch (_) {}

    /*
      Last-resort plain-text parser. It keeps the previous good player list
      if the site's markup changes enough that this can't be parsed safely.
    */
    const plain = rawToText(raw);
    const sectionMatch = plain.match(
      /Top Players([\s\S]*?)Select a Player/i
    );

    if (!sectionMatch) {
      throw new Error("Top Players section was not found.");
    }

    throw new Error("Top Players section could not be parsed safely.");
  }

  async function fetchText(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try {
      const response = await fetch(url, {
        cache: "no-store",
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return await response.text();
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchSite() {
    const cacheBust = Date.now();

    try {
      return await fetchText(
        "https://playforapurpose.org/?overlay_refresh=" + cacheBust
      );
    } catch (_) {
      return await fetchText(
        "https://r.jina.ai/https://playforapurpose.org/?overlay_refresh=" +
        cacheBust
      );
    }
  }

  async function update() {
    if (inFlight) return;
    inFlight = true;

    try {
      const raw = await fetchSite();
      const plain = rawToText(raw);

      let overall = null;
      let players = null;

      try {
        overall = parseOverall(plain);
      } catch (_) {}

      try {
        players = parseTopPlayers(raw);
      } catch (_) {}

      /*
        Each dataset is independently fail-safe:
        a successful overall update cannot wipe a cached player list,
        and a successful player update cannot wipe a cached fundraiser total.
      */
      const next = {
        raised: overall ? overall.raised : lastGood.raised,
        goal: overall ? overall.goal : lastGood.goal,
        players: players && players.length ? players : lastGood.players
      };

      lastGood = next;
      saveGood(lastGood);
      renderStats(lastGood);

    } catch (_) {
      /* Total request failure: keep every last-good value exactly as-is. */
      renderStats(lastGood);
    } finally {
      inFlight = false;
    }
  }

  function restoreStats() {
    tickerLayer.classList.remove("active", "intro", "ticker-exit");
    tickerStinger.classList.remove("intro");

    tickerTrack.style.transition = "none";
    tickerTrack.style.transform = "translateX(0px)";
    tickerTrack.replaceChildren();

    /*
      Keep the fundraiser permanently in its settled/built state. This is the
      key fix for the one-frame flash after the ticker: removing the return
      animation no longer exposes the original delayed entrance animation.
    */
    statsContent.classList.remove("ticker-hidden", "stats-return");
    void statsContent.offsetWidth;
    statsContent.classList.add("stats-return");

    window.setTimeout(() => {
      statsContent.classList.remove("stats-return");
      tickerRunning = false;
    }, 320);
  }

  function showTicker() {
    if (tickerRunning) return;
    if (!lastGood.players || lastGood.players.length === 0) return;

    tickerRunning = true;
    renderTickerItems(lastGood.players);

    /*
      Phase 1: pull the fundraiser content away while leaving the navy panel
      intact. The stinger then builds directly on top of that stable panel.
    */
    statsContent.classList.remove("stats-return");
    statsContent.classList.add("ticker-hidden");

    window.setTimeout(() => {
      tickerStinger.classList.remove("intro");
      void tickerStinger.offsetWidth;
      tickerStinger.classList.add("intro");
    }, 110);

    /*
      Phase 2: once the red punch and blue sweep are nearly complete, reveal
      the finished ticker state and punch in the TOP PLAYERS label.
    */
    window.setTimeout(() => {
      tickerLayer.classList.remove("ticker-exit", "intro");
      tickerLayer.classList.add("active", "intro");

      const viewportWidth = tickerViewport.clientWidth;
      const trackWidth = tickerTrack.scrollWidth;
      const startX = viewportWidth + 30;
      const endX = -trackWidth - 30;
      const distance = startX - endX;
      const durationMs = Math.max(
        12000,
        Math.round((distance / TICKER_SPEED_PX_PER_SEC) * 1000)
      );

      tickerTrack.style.transition = "none";
      tickerTrack.style.transform = `translateX(${startX}px)`;

      /*
        Phase 3: start motion only after the graphic itself has finished
        building, which makes the entrance read like a broadcast package
        instead of a web ticker simply fading on.
      */
      window.setTimeout(() => {
        tickerStinger.classList.remove("intro");

        tickerTrack.style.transition =
          `transform ${durationMs}ms linear`;
        tickerTrack.style.transform = `translateX(${endX}px)`;

        window.setTimeout(() => {
          tickerLayer.classList.remove("intro");
          tickerLayer.classList.add("ticker-exit");

          window.setTimeout(restoreStats, 190);
        }, durationMs + 100);

      }, 290);

    }, 610);
  }

  function scheduleTicker() {
    window.setTimeout(() => {
      showTicker();

      tickerTimer = window.setInterval(
        showTicker,
        TICKER_INTERVAL_MS
      );
    }, FIRST_TICKER_DELAY_MS);
  }

  renderStats(lastGood);
  settleInitialBuild();

  update();
  setInterval(update, UPDATE_INTERVAL_MS);
  scheduleTicker();

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      update();
    }
  });
})();
</script>
</body>
</html>
